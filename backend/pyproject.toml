[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.4.0",
    "fastapi==0.141.1",
    "fastmcp>=3.4.5,<3.5.0",
    "langgraph==1.2.11",
    "pydantic==2.13.5",
    "redis==8.1.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs a real dependency (e.g. Redis via docker compose), not just pure unit logic",
]
